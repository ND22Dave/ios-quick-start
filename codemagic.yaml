# Codemagic's iOS native sample, set up with the FamTiVi Codemagic parameters (from famtivi_app):
# Mac mini M2, Xcode 26.6, and FamTiVi's App Store signing for com.famtivi.app (team TXQ9L8UMDX).
# Build only: there is deliberately no publishing section, so this sample never uploads to
# FamTiVi's App Store Connect record or TestFlight.
workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.famtivi.app
      vars:
        XCODE_WORKSPACE: "swiftly.xcworkspace"
        XCODE_SCHEME: "swiftly"
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: pod install
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
